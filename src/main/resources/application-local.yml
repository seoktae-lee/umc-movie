# 로컬 개발 (내 컴퓨터 MySQL). 기본 프로필이라 ./gradlew bootRun만 해도 이 파일을 읽는다.
spring:
  config:
    # 프로젝트 루트의 .env(깃에 올리지 않는다)를 설정으로 읽는다. 없어도 실행 환경 변수를 쓰면 된다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: ${DB_USER:root}
    # 로컬 MySQL root에 비밀번호가 없으면 비워 둔다.
    password: ${DB_PASSWORD:}

app:
  cors:
    # 프론트 개발 서버 주소. (mock-frontend, MovieLog Flutter 웹 모두 5173으로 띄운다)
    # 여러 개면 쉼표로 잇는다.
    allowed-origins: http://localhost:5173
