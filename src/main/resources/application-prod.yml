# 운영 (EC2 + RDS). 10주차.
# 주소·계정·비밀 값은 파일에 쓰지 않고 EC2 실행 환경 변수로만 받는다. 기본값이 없어 빠지면 시작 단계에서 실패한다.
#   DB_HOST, DB_USER, DB_PASSWORD, JWT_SECRET, FRONTEND_ORIGINS
server:
  address: 0.0.0.0 # EC2 바깥(퍼블릭 IP)에서 들어오는 요청을 받는다.
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/movie_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 운영 DB는 준비한 스키마(docs/sql/10_prod_schema.sql)를 검증만 한다. create/update 금지.
      ddl-auto: validate

app:
  cors:
    # 프론트 Origin(스킴+호스트[+포트], 경로 없이). 로컬 개발 주소도 쓰려면 쉼표로 함께 넣는다.
    allowed-origins: ${FRONTEND_ORIGINS}

springdoc:
  swagger-ui:
    # 학습용 배포에서만 API 점검에 쓴다. 실제 서비스라면 운영에서는 끈다.
    enabled: true
