# 모든 환경에서 같은 공통 설정. (10주차에 환경마다 달라지는 값은 application-{profile}.yml로 나눴다)
#
#   SPRING_PROFILES_ACTIVE=local (기본) → application-local.yml : 내 컴퓨터 MySQL
#   SPRING_PROFILES_ACTIVE=prod         → application-prod.yml  : RDS MySQL, 값은 전부 환경 변수
#   @ActiveProfiles("test")             → src/test/resources/application-test.yml : H2
spring:
  profiles:
    # 아무 프로필도 지정하지 않고 실행하면 로컬 설정을 쓴다.
    default: local
  jpa:
    # 테이블은 SQL로 직접 만들었으므로 Hibernate는 엔티티와 테이블이 맞는지 검사만 한다.
    # (운영 DB 스키마를 앱이 자동으로 바꾸지 않는다. test 프로필만 create-drop으로 덮어쓴다)
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # 6주차부터 실패 응답은 GlobalExceptionHandler가 ApiResponse로 만든다.
    # 그래도 처리되지 않은 경로(예: 없는 URL 404)를 위해 문구는 남겨 둔다.
    include-message: always

jwt:
  secret: ${JWT_SECRET} # 서명에 쓸 비밀키. 코드에 직접 쓰지 않는다. (32자 이상)
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600} # 토큰 유효시간(초)
