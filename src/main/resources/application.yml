spring:
  datasource:
    url: jdbc:mysql://localhost:3306/umc_movie
    username: root
    # 비밀번호는 환경 변수 DB_PASSWORD로 받는다. (로컬 MySQL root에 비밀번호가 없으면 비워 둔다)
    password: ${DB_PASSWORD:}
  jpa:
    # 테이블은 SQL로 직접 만들었으므로 Hibernate는 엔티티와 테이블이 맞는지 검사만 한다.
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  error:
    # 6주차부터 실패 응답은 GlobalExceptionHandler가 ApiResponse로 만든다.
    # 그래도 처리되지 않은 경로(예: 없는 URL 404)를 위해 문구는 남겨 둔다.
    include-message: always

app:
  cors:
    # 프론트 개발 서버 주소. (mock-frontend, MovieLog Flutter 웹 모두 5173으로 띄운다)
    # 여러 개면 쉼표로 잇는다. "*"로 바꾸면 모든 출처를 허용한다. (docs의 비교 참고)
    allowed-origins: http://localhost:5173
