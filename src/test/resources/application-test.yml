# 통합 테스트(@ActiveProfiles("test"))에서만 쓰는 설정. (9주차)
#
# 개발용 MySQL을 그대로 쓰면 테스트를 돌릴 때마다 내 DB에 쓰레기 데이터가 쌓이고,
# 이전 테스트가 남긴 데이터 때문에 다음 테스트가 실패하기도 한다.
# 그래서 테스트가 돌 때만 메모리 위에 잠깐 만들어졌다 사라지는 H2를 쓴다. (설치할 것도, 켜 둘 것도 없다)
spring:
  datasource:
    # MODE=MySQL: H2에게 "MySQL인 척 해 달라"고 부탁하는 옵션
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 테스트마다 메모리 DB의 스키마를 새로 만들어 엔티티 매핑도 함께 검증한다.
      ddl-auto: create-drop
    open-in-view: false

# JwtUtil이 값을 찾지 못하면 서버를 띄우는 단계에서 실패하므로 테스트용 값을 둔다.
jwt:
  secret: test-secret-for-integration-tests-only-32-chars
  access-expiration: 3600

# 10주차: CORS 허용 목록은 프로필별 파일로 옮겼으므로 테스트 프로필에도 둔다.
app:
  cors:
    allowed-origins: http://localhost:5173
